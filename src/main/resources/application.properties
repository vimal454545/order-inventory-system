# Application Name and Port
spring.application.name=order-inventory-system
server.port=${PORT:8080}

# Supabase Database Configuration (Session Pooler IPv4 & Direct Connection Compatible)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres.xymmqeycfgiajdnbqleo}
spring.datasource.password=${DB_PASSWORD:ViMaL0@45@vj}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic JDBC metadata queries for Supabase Cloud & Render compatibility
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# OpenAPI / Swagger Documentation Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
